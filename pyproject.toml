[project]
name = "amazonpricecompetitor"
version = "0.1.0"
description = "Selenium-based Amazon competitor research with durable SQLite evidence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.9",
    "langchain-openai>=1.1.14",
    "openai>=1.107.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.54.0",
    "pydantic>=2.11.9",
    "selenium>=4.27.1",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly enabled tests that can contact external services"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
