[project]
name = "amazonpricecompetitor"
version = "0.1.0"
description = "Evidence-backed Amazon competitor intelligence with FastAPI, React and Playwright"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.9",
    "langchain-groq>=1.1.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.54.0",
    "pydantic>=2.11.9",
    "selenium>=4.27.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13.0",
    "playwright>=1.44.0",
    "pydantic-settings>=2.3.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "--basetemp=.test-tmp"
markers = ["live: explicitly enabled tests that can contact external services"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/collector/amazon.py"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
