x-backend: &backend
  build: .
  image: aci-v2-backend:local
  environment: &environment
    APP_ENV: production
    APP_DATABASE_URL: postgresql+asyncpg://aci:${POSTGRES_PASSWORD:-aci_local}@postgres:5432/aci
    APP_EVIDENCE_DIR: /app/runtime/evidence
    APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    APP_GROQ_API_KEY: ${APP_GROQ_API_KEY:-${GROQ_API_KEY:-}}
    APP_GROQ_MODEL: ${APP_GROQ_MODEL:-openai/gpt-oss-20b}
    APP_MIN_NAVIGATION_INTERVAL_SECONDS: ${APP_MIN_NAVIGATION_INTERVAL_SECONDS:-5}
    APP_MAX_COMPETITORS: ${APP_MAX_COMPETITORS:-20}
    APP_MAX_SEARCH_PAGES: ${APP_MAX_SEARCH_PAGES:-2}
    APP_BLOCK_COOLDOWN_SECONDS: ${APP_BLOCK_COOLDOWN_SECONDS:-300}
    APP_API_RATE_LIMIT_PER_MINUTE: ${APP_API_RATE_LIMIT_PER_MINUTE:-5}
    APP_MAX_EVIDENCE_BYTES: ${APP_MAX_EVIDENCE_BYTES:-5242880}
    APP_MAX_ANALYSIS_INPUT_BYTES: ${APP_MAX_ANALYSIS_INPUT_BYTES:-131072}
  volumes:
    - runtime:/app/runtime
  init: true

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aci_local}
      POSTGRES_DB: aci
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aci -d aci"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    <<: *backend
    command: [".venv/bin/python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [".venv/bin/python", "-m", "app.worker.runner"]
    shm_size: 1gb
    stop_signal: SIGINT
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  runtime:
